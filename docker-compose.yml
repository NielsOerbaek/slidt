services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: slidt
      POSTGRES_USER: slidt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-slidt}
    volumes:
      - ./data/pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U slidt']
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_DB: slidt_test
      POSTGRES_USER: slidt
      POSTGRES_PASSWORD: slidt
    ports:
      - '5433:5432'
    volumes:
      - ./data/pg-test:/var/lib/postgresql/data
    profiles: ['test']

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://slidt:${POSTGRES_PASSWORD:-slidt}@postgres:5432/slidt
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ASSETS_DIR: /data/assets
      APP_URL: ${APP_URL:-http://localhost:3000}
      SESSION_SECRET: ${SESSION_SECRET:-dev-secret-change-in-production}
      ORIGIN: ${ORIGIN:-http://localhost:3000}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OLLAMA_DEFAULT_MODEL: ${OLLAMA_DEFAULT_MODEL:-qwen3.6:35b}
      AGENT_BACKEND: ${AGENT_BACKEND:-legacy}
    volumes:
      - ./data/assets:/data/assets
    ports:
      - '3000:3000'

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ./data/ollama:/root/.ollama
    ports:
      - '11434:11434'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    profiles: [ollama]

  caddy:
    image: caddy:2-alpine
    depends_on:
      - app
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      APP_HOST: ${APP_HOST:-localhost}
    dns:
      - 8.8.8.8
      - 8.8.4.4
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    profiles: ['caddy']

volumes:
  caddy_data:
  caddy_config:
